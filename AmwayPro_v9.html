<head>

<meta name="apple-mobile-web-app-title" content="AmwayPro v9">

<title>AmwayPro v9</title>
<script>
// ── Limpiar Service Workers anteriores (no registrar nuevos desde blob) ──
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  }).catch(()=>{});
}
if('caches' in window){
  caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});
}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── PALETA OSCURA ── */
  --bg:#0f0e1a;
  --bg2:#161428;
  --surface:#1e1b33;
  --surface2:#252240;
  --surface3:#2d2952;
  --border:#332f5a;
  --border2:#3d3870;

  --indigo:#818cf8;
  --indigo-d:#6366f1;
  --purple:#a78bfa;
  --green:#34d399;
  --green-d:#059669;
  --amber:#fbbf24;
  --amber-d:#d97706;
  --red:#f87171;
  --red-d:#dc2626;
  --cyan:#22d3ee;

  --text:#f1f0ff;
  --text2:#c4c0e8;
  --muted:#7c78a8;

  --shadow:0 4px 24px rgba(0,0,0,.5);
  --shadow-sm:0 2px 10px rgba(0,0,0,.4);
  --radius:18px;--radius-sm:13px;--radius-xs:9px;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --nav-h:66px;
}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100%;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  padding-top:var(--st);
}
input,select,button,textarea{font-family:inherit;color:var(--text)}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{display:none}
*{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ── LAYOUT ── */
#app{max-width:480px;margin:0 auto;min-height:100vh}
#header{
  position:sticky;top:0;z-index:200;
  background:rgba(15,14,26,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:12px 16px 10px;
  display:flex;justify-content:space-between;align-items:center;
}
#content{padding:14px;padding-bottom:calc(var(--nav-h) + var(--sb) + 16px)}
#nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:rgba(15,14,26,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);z-index:200;display:flex;
  padding-bottom:var(--sb);
}
.nav-btn{
  flex:1;padding:10px 0 9px;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;
}
.nav-btn::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:0;height:2px;border-radius:0 0 99px 99px;
  background:var(--indigo);transition:width .25s cubic-bezier(.34,1.56,.64,1);
}
.nav-btn.active::after{width:36px}
.nav-icon{font-size:21px;line-height:1;transition:transform .2s}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-label{font-size:10px;font-weight:700;color:var(--muted);transition:color .15s}
.nav-btn.active .nav-label{color:var(--indigo)}

/* ── CARDS ── */
.card{
  background:var(--surface);border-radius:var(--radius);padding:16px;
  border:1px solid var(--border);margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}
.stat-card{
  background:var(--surface);border-radius:var(--radius-sm);padding:13px 15px;
  border:1px solid var(--border);
}

/* ── FORMS ── */
.field{margin-bottom:14px}
.field label{
  display:block;font-size:11px;font-weight:700;color:var(--muted);
  margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase;
}
.input{

  border:1.5px solid var(--border2);
  border-radius:var(--radius-sm);font-size:16px;
  background:var(--surface2);color:var(--text);

select.input{appearance:auto;-webkit-appearance:auto}

/* ── BUTTONS ── */
.btn{

<body>
<div id="offline-banner">📴 Sin conexión — Modo offline activo</div>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';

window.addEventListener('online', ()=>document.getElementById('offline-banner').style.display='none');
window.addEventListener('offline',()=>document.getElementById('offline-banner').style.display='block');

// ═══════════════════════════════════════════════
// PERSISTENCIA BLINDADA — Triple capa:
//   1. localStorage  (síncrono, siempre disponible)
//   2. IndexedDB     (asíncrono, mayor capacidad)
//   3. sessionStorage (sobrevive cambios de pestaña en la misma sesión)
// Se guarda automáticamente al cambiar/ocultar pestaña.
// ═══════════════════════════════════════════════
const DB_NAME='AmwayProDB', DB_VER=1;
let _db=null;

function openDB(){
  return new Promise((res,rej)=>{
    if(_db){res(_db);return}
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('kv'))
        db.createObjectStore('kv',{keyPath:'k'});
    };
    req.onsuccess=e=>{_db=e.target.result;res(_db)};
    req.onerror=()=>rej(req.error);
  });
}

// Guardar síncronamente en localStorage Y sessionStorage, luego en IDB
async function dbSet(k,v){
  const json=JSON.stringify(v);
  // 1. localStorage — persiste entre sesiones
  try{localStorage.setItem(k,json)}catch(e){console.warn('LS write',e)}
  // 2. sessionStorage — sobrevive cambio de pestaña en la misma sesión
  try{sessionStorage.setItem(k,json)}catch(e){}
  // 3. IndexedDB — asíncrono, backup de mayor capacidad
  try{
    const db=await openDB();
    const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').put({k,v});
  }catch(e){console.warn('IDB write',e)}
}

// Leer: busca en las 3 capas, elige la más completa
async function dbGet(k){
  let fromLS=null,fromSS=null,fromIDB=null;
  try{const v=localStorage.getItem(k);if(v)fromLS=JSON.parse(v)}catch(e){}
  try{const v=sessionStorage.getItem(k);if(v)fromSS=JSON.parse(v)}catch(e){}
  try{
    const db=await openDB();
    fromIDB=await new Promise((res,rej)=>{
      const tx=db.transaction('kv','readonly');
      const req=tx.objectStore('kv').get(k);
      req.onsuccess=()=>res(req.result?req.result.v:null);
      req.onerror=()=>res(null);
    });
  }catch(e){}
  // Elegir la versión con más datos (array más largo)
  const candidates=[fromLS,fromSS,fromIDB].filter(x=>x!==null);
  if(!candidates.length)return null;
  candidates.sort((a,b)=>{
    const la=Array.isArray(a)?a.length:0;
    const lb=Array.isArray(b)?b.length:0;
    return lb-la;
  });
  return candidates[0];
}

function exportarDatos(){

    fecha:new Date().toISOString(),
    productos:S.productos,
    ventas:S.ventas,
    clientes:S.clientes,

  a.href=URL.createObjectURL(blob);
  a.download=`AmwayPro_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();URL.revokeObjectURL(a.href);
  toast('✅ Backup exportado exitosamente');
}
function importarDatos(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=async e=>{
    try{
      const file=e.target.files[0];if(!file)return;
      const text=await file.text();
      const datos=JSON.parse(text);
      if(!datos.productos||!datos.ventas)throw new Error('Formato inválido');
      if(!confirm(`¿Restaurar backup del ${datos.fecha?.split('T')[0]||'?'}? Se reemplazarán todos los datos actuales.`))return;
      S.productos=datos.productos||[...PB];
      S.ventas=datos.ventas||[];
      S.clientes=datos.clientes||[];
      S.gastos=datos.gastos||[];
      S.recordatorios=datos.recordatorios||[];
      await saveAll();
      toast('✅ Datos restaurados correctamente');
      renderNow();
    }catch(err){toast('❌ Error al importar: '+err.message)}
  };
  input.click();
}

function hoy(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(n){if(n===null||n===undefined||isNaN(n))return'—';return'$'+Math.round(n).toLocaleString('es-CO')}
function calcP(p){const b=p.iva?p.costoIBO*1.18:p.costoIBO;return{base:b,p20:Math.round(b*1.2),p25:Math.round(b*1.25),p30:Math.round(b*1.3),pMin:Math.round(b*1.1)}}
function pV(p,n){const c=calcP(p);return n===20?c.p20:n===25?c.p25:c.p30}
function gan(p,n,c){const c2=calcP(p);return(pV(p,n)-c2.base)*c}
function sum(a,k){return a.reduce((s,v)=>s+(v[k]||0),0)}
function estStock(s){
  if(s===0)return{label:'Agotado',e:'🔴',color:'var(--red)',bg:'rgba(248,113,113,.15)'};
  if(s<=3)return{label:'Bajo',e:'🟡',color:'var(--amber)',bg:'rgba(251,191,36,.12)'};
  if(s<=10)return{label:'Normal',e:'🔵',color:'var(--cyan)',bg:'rgba(34,211,238,.1)'};
  return{label:'Bueno',e:'🟢',color:'var(--green)',bg:'rgba(52,211,153,.1)'}
}
function estPago(t,p){
  if(p>=t)return{label:'✅ Pagado',color:'var(--green)',bg:'rgba(52,211,153,.12)'};
  if(p>0)return{label:'🔶 Parcial',color:'var(--amber)',bg:'rgba(251,191,36,.12)'};
  return{label:'⏳ Pendiente',color:'var(--red)',bg:'rgba(248,113,113,.12)'}
}
function carritoTotal(){
  return S.vCarrito.reduce((t,item)=>{
    const p=S.productos.find(x=>x.id===item.productoId);if(!p)return t;
    // Precio custom ignora niveles — se usa el precio exacto cobrado
    const precio=item.precioCustom!=null?item.precioCustom:pV(p,item.nivel);
    const costoBase=calcP(p).base;
    const ganancia=(precio-costoBase)*item.cantidad;
    return{total:t.total+precio*item.cantidad,ganancia:t.ganancia+ganancia};
  },{total:0,ganancia:0});
}
function stockDisp(pid){
  const p=S.productos.find(x=>x.id===pid);if(!p)return 0;
  const en=S.vCarrito.filter(i=>i.productoId===pid&&i.uid!==S._editUID).reduce((s,i)=>s+i.cantidad,0);
  return p.stock-en
}

  let agregados=0;

    if(!nombre)return;
    const existe=S.clientes.some(c=>c.nombre===nombre);
    if(!existe){
      const nuevoId=Date.now()+Math.random()*1000|0;
      S.clientes.push({id:nuevoId,nombre:nombre,telefono:'',notas:'',fechaCreado:v.fecha||hoy()});

      S.ventas=S.ventas.map(x=>x.cliente===nombre&&!x.clienteId?{...x,clienteId:nuevoId}:x);
      agregados++;
    }
  });
  if(agregados>0){
    saveAll();

function rDash(){
  const now=new Date(), hs=hoy(), ma=now.getMonth()+1, aa=now.getFullYear();

  // ── Filtro único para todos los bloques del dashboard ──
  const fn=_calcRangoFn(S.dRango, S.dFecha, S.dMes, S.dAnio);
  const vFil=S.ventas.filter(v=>fn(v.fecha));
  const gFil=S.gastos.filter(g=>fn(g.fecha));

  // Totales del período filtrado
  const tFil=sum(vFil,'totalVenta');
  const cFil=sum(vFil,'montoPagado');

        <div style="font-size:40px;font-weight:900;letter-spacing:-1.5px;line-height:1">${fmt(tFil)}</div>

      </div>
      <div style="text-align:right;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 14px">

      ${[['✅ Cobrado',fmt(cFil)],['⏳ Cartera',fmt(sFil)],['💸 Gastos',fmt(gastFil)],['💵 A mano',fmt(aMano)]].map(([k,v],i)=>'<div style="padding:9px 4px;text-align:center;'+(i>0?'border-left:1px solid rgba(255,255,255,.1)':'')+'">'+'<div style="font-size:9px;opacity:.5;margin-bottom:2px">'+k+'</div>'+'<div style="font-weight:800;font-size:12px">'+v+'</div></div>').join('')}
    </div>

  <!-- ═══ TARJETAS DE MÉTRICAS ═══ -->

      <div style="font-weight:900;font-size:22px;color:var(--green);letter-spacing:-.5px">${fmt(cFil)}</div>

    <!-- Ganancia -->

  <!-- ═══ VENTAS RECIENTES DEL PERÍODO ═══ -->
  ${vFil.length>0?(()=>{
    const rec=vFil.slice().sort((a,b)=>b.id-a.id).slice(0,5);
    return'<p class="section-title">🧾 Ventas recientes — '+labelD+'</p>'
    +rec.map(v=>{
      const ep=estPago(v.totalVenta,v.montoPagado);
      return'<div class="card" style="padding:12px 14px;margin-bottom:8px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center">'
          +'<div style="flex:1;min-width:0">'
            +'<div style="font-weight:800;font-size:14px;color:var(--text)">'+(v.cliente||'Sin nombre')+'</div>'
            +'<div style="font-size:11px;color:var(--muted);margin-top:2px">'+v.fecha+' · '+(v.items?v.items.length+' producto'+(v.items.length!==1?'s':''):v.producto)+'</div>'
          +'</div>'
          +'<div style="text-align:right;flex-shrink:0;margin-left:10px">'
            +'<div style="font-weight:900;font-size:15px;color:var(--indigo)">'+fmt(v.totalVenta)+'</div>'
            +'<span class="badge" style="background:'+ep.bg+';color:'+ep.color+'">'+ep.label+'</span>'
          +'</div>'
        +'</div>'
      +'</div>';
    }).join('')
    +(vFil.length>5?'<div style="text-align:center;padding:8px"><button class="btn btn-sm btn-outline-primary" onclick="S.tab=\'historial\';S.hRango=S.dRango;S.hFecha=S.dFecha;renderNow()">Ver todas ('+vFil.length+') →</button></div>':'');
  })():''}

  <!-- ═══ INVENTARIO ═══ -->
  <p class="section-title" style="margin-top:4px">📦 Inventario</p>
  <div class="grid-3">
    ${sc('🔴','Agotados',ag.length,'var(--red)')}
    ${sc('🟡','Bajo stock',pBajo.length,'var(--amber)')}
    ${sc('🟢','Con stock',S.productos.filter(p=>p.stock>3).length,'var(--green)')}
  </div>
  ${ag.length?'<div class="card" style="border-left:3px solid var(--red);margin-top:8px"><div style="font-weight:800;color:var(--red);font-size:14px;margin-bottom:10px">🔴 Sin stock — reponer</div>'+ag.slice(0,6).map(p=>'<div style="font-size:13px;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between"><span>'+p.nombre+'</span><span style="color:var(--red);font-weight:700">0 uds</span></div>').join('')+(ag.length>6?'<div style="font-size:12px;color:var(--muted);margin-top:8px">+' +(ag.length-6)+ ' más agotados</div>':'')+'</div>':''}

  <!-- ═══ ALERTAS SEGUIMIENTO ═══ -->
  ${(()=>{
    const hoy_=hoy();
    const vencHoy=S.recordatorios.filter(r=>!r.completado&&r.fechaProgr===hoy_);
    const vencidos=S.recordatorios.filter(r=>!r.completado&&r.fechaProgr<hoy_);
    if(!vencHoy.length&&!vencidos.length)return'';
    return'<div style="background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(217,119,6,.08));border:1.5px solid rgba(251,191,36,.3);border-radius:var(--radius);padding:14px 16px;margin-top:8px;cursor:pointer" onclick="setTab(\'seguimiento\')">'
      +'<div style="font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.7px;font-weight:800;margin-bottom:8px">🔔 Seguimientos pendientes</div>'
      +(vencHoy.length?'<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px">⚡ '+vencHoy.length+' para hoy</div>':'')
      +(vencidos.length?'<div style="font-size:13px;font-weight:700;color:var(--red)">⏰ '+vencidos.length+' vencido'+(vencidos.length!==1?'s':'')+'</div>':'')
      +'<div style="font-size:12px;color:var(--muted);margin-top:6px;font-weight:600">Toca para ver → Seguimiento</div>'
    +'</div>';
  })()}
  `;
}

        <div style="font-size:12px;color:var(--muted);margin-top:2px">${vsCli.length} venta${vsCli.length!==1?'s':''} · ${fmt(totCli)}</div>

        ${S.auth==='admin'?`<button class="btn btn-xs" style="background:rgba(129,140,248,.12);color:var(--indigo)" onclick="abrirEditCliente(${c.id})">✏️</button>`:''}

  const totCli=sum(vsCli,'totalVenta'),pagCli=sum(vsCli,'montoPagado'),ganCli=sum(vsCli,'gananciaReal');

// Acciones clientes
function guardarNuevoCliente(){
  const n=S.clNuevo;if(!n.nombre.trim())return;
  const c={id:Date.now(),nombre:n.nombre.trim(),telefono:(n.telefono||'').trim(),notas:(n.notas||'').trim(),fechaRegistro:hoy()};
  S.clientes=[...S.clientes,c];
  saveAll();toast(`✅ Cliente "${c.nombre}" registrado`);
  S.clSheetN=false;S.clNuevo={nombre:'',telefono:'',notas:''};renderNow();
}
function abrirEditCliente(id){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  S.clSheetE=c;S.clEdit={nombre:c.nombre,telefono:c.telefono||'',notas:c.notas||''};renderNow();
}
function guardarEditCliente(){
  const e=S.clEdit;if(!e.nombre.trim())return;
  S.clientes=S.clientes.map(c=>c.id===S.clSheetE.id?{...c,nombre:e.nombre.trim(),telefono:e.telefono.trim(),notas:e.notas.trim()}:c);
  saveAll();toast(`✅ Cliente actualizado`);S.clSheetE=null;renderNow();
}
function eliminarCliente(id,fromSheet=false){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  if(!confirm(`¿Eliminar a "${c.nombre}"?\nSus ventas se conservarán en el historial.`))return;
  S.clientes=S.clientes.filter(x=>x.id!==id);
  saveAll();toast(`🗑️ "${c.nombre}" eliminado`);
  if(fromSheet)S.clSheetE=null;renderNow();
}
function verClienteVentas(id){
  S.clSheetV=S.clientes.find(x=>x.id===id);renderNow();
}

function _updPrecioCustomPreview(){
  const selP=S.productos.find(p=>p.id===parseInt(S.vSelProdId));

  const cant=parseInt(S.vSelCant)||0;

  const precio=S.vUsarPrecioCustom&&precioC>0?precioC:pV(selP,S.vSelNivel);
  const base=calcP(selP).base;
  const ganancia=(precio-base)*cant;

  const gv=document.getElementById('sub-gan-val');
  const warn=document.getElementById('precio-custom-warn');
  if(tv&&cant>0)tv.textContent='$'+Math.round(precio*cant).toLocaleString('es-CO');
  if(gv){gv.textContent='Ganancia: $'+Math.round(ganancia).toLocaleString('es-CO');gv.style.color=ganancia<0?'var(--red)':'var(--green)';}

  if(cnt)cnt.textContent=fil.length+' cliente'+(fil.length!==1?'s':'');
  if(fil.length===0){container.innerHTML=`<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-text">${S.clQ?'Sin resultados':'Aún no tienes clientes'}</div><div class="empty-sub">${S.clQ?'Prueba otra búsqueda':'Toca "+ Nuevo cliente" para agregar'}</div></div>`;return;}
  container.innerHTML=fil.map(c=>{const vsCli=S.ventas.filter(v=>v.clienteId===c.id||v.cliente===c.nombre);const totCli=sum(vsCli,'totalVenta');const pagCli=sum(vsCli,'montoPagado');const salCli=totCli-pagCli;
    return`<div class="card" style="padding:14px 16px">

      <div class="cliente-avatar">${initials(c.nombre)}</div>

        ${salCli>0?`<div style="font-size:11px;color:var(--red);font-weight:700;margin-top:2px">⏳ Saldo: ${fmt(salCli)}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0">
        <button class="btn btn-xs btn-outline-primary" onclick="verClienteVentas(${c.id})">Ver</button>

        ${S.auth==='admin'?`<button class="btn btn-xs btn-danger" onclick="eliminarCliente(${c.id})">🗑️</button>`:''}
      </div>

}
function _togE(){
  const el=document.getElementById('tgl-e-iva');
  if(el)el.className='toggle'+(S.invEdit.iva?' on':'');
}
function _updStock(){
  const n=parseInt(S.invAdd)||0;
  const p=S.invSheetP;if(!p)return;
  const lbl=document.getElementById('stock-preview');
  if(lbl)lbl.innerHTML=`Actual: <b style="color:var(--indigo)">${p.stock}</b>${n>0?` → <b style="color:var(--green)">${p.stock+n}</b>`:''} unidades`;
  const btn=document.getElementById('btn-confirStock');
  if(btn)btn.disabled=n<1;
  if(btn)btn.textContent=`✓ Confirmar +${n} unidades`;
}

function confirStock(){
  const n=parseInt(S.invAdd);if(!n||n<1)return;
  S.productos=S.productos.map(p=>p.id===S.invSheetP.id?{...p,stock:p.stock+n}:p);
  saveAll();toast(`✅ +${n} uds · ${S.invSheetP.nombre}`);
  S.invSheetP=null;S.invAdd='';renderNow();
}
function confirNuevo(){
  const n=S.invNuevo;if(!n.nombre.trim()||!n.costoIBO)return;
  S.productos=[...S.productos,{...n,id:Date.now(),costoIBO:parseFloat(n.costoIBO),stock:0}];
  saveAll();toast(`✅ "${n.nombre}" agregado`);
  S.invSheetN=false;S.invNuevo={nombre:'',tipo:'Cuidado Personal',costoIBO:'',iva:false};renderNow();
}
function abrirEditProd(id){
  const p=S.productos.find(x=>x.id===id);if(!p)return;
  S.invSheetE=p;S.invEdit={nombre:p.nombre,tipo:p.tipo,costoIBO:String(p.costoIBO),iva:p.iva,stock:p.stock};renderNow();
}
function guardarEditProd(){
  const e=S.invEdit;if(!e.nombre.trim()||!e.costoIBO)return;
  S.productos=S.productos.map(p=>p.id===S.invSheetE.id?{...p,nombre:e.nombre.trim(),tipo:e.tipo,costoIBO:parseFloat(e.costoIBO),iva:e.iva,stock:parseInt(e.stock)||0}:p);
  saveAll();toast(`✅ "${e.nombre}" actualizado`);S.invSheetE=null;renderNow();
}
function eliminarProd(id){
  const p=S.productos.find(x=>x.id===id);if(!p)return;
  if(!confirm(`¿Eliminar "${p.nombre}"?`))return;
  S.productos=S.productos.filter(x=>x.id!==id);saveAll();toast(`🗑️ "${p.nombre}" eliminado`);renderNow();
}
function eliminarProdDesdeSheet(id){
  const p=S.productos.find(x=>x.id===id);if(!p)return;
  if(!confirm(`¿Eliminar "${p.nombre}" permanentemente?`))return;
  S.productos=S.productos.filter(x=>x.id!==id);S.invSheetE=null;saveAll();toast(`🗑️ "${p.nombre}" eliminado`);renderNow();
}

        <span style="font-weight:800;font-size:16px">TOTAL</span>
        <span style="font-weight:900;font-size:26px;color:var(--indigo);letter-spacing:-.5px">${fmt(totalC)}</span>
      </div>

    ${S.vCarritoErr?`<div style="color:var(--red);font-size:13px;font-weight:700;padding:10px 14px;background:rgba(248,113,113,.1);border-radius:10px;border:1px solid rgba(248,113,113,.2)">⚠ ${S.vCarritoErr}</div>`:''}

        return`<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">

}

// ── DOM selectivo: historial ──
function _calcRangoFn(rango, fecha, mes, anio){
  const now=new Date(), h=hoy();
  if(rango==='hoy') return f=>f===h;
  if(rango==='semana'){
    const dia=now.getDay()||7;
    const lunes=new Date(now);lunes.setDate(now.getDate()-(dia-1));lunes.setHours(0,0,0,0);
    const domingo=new Date(lunes);domingo.setDate(lunes.getDate()+6);domingo.setHours(23,59,59,999);
    return f=>{const d=new Date(f+'T12:00:00');return d>=lunes&&d<=domingo;};
  }
  if(rango==='mes') return f=>{const d=new Date(f+'T12:00:00');return d.getMonth()+1===now.getMonth()+1&&d.getFullYear()===now.getFullYear();};
  if(rango==='mes-esp') return f=>{const d=new Date(f+'T12:00:00');return d.getMonth()+1===mes&&d.getFullYear()===anio;};
  if(rango==='dia') return f=>!fecha||f===fecha;
  return ()=>true;
}
function _calcHRangoFn(){
  const now=new Date();
  const h=hoy();
  if(S.hRango==='hoy') return fecha=>fecha===h;
  if(S.hRango==='semana'){
    const dia=now.getDay()||7;
    const lunes=new Date(now);lunes.setDate(now.getDate()-(dia-1));lunes.setHours(0,0,0,0);
    const domingo=new Date(lunes);domingo.setDate(lunes.getDate()+6);domingo.setHours(23,59,59,999);
    return fecha=>{const d=new Date(fecha+'T12:00:00');return d>=lunes&&d<=domingo;};
  }
  if(S.hRango==='mes'){
    const ma=now.getMonth()+1,aa=now.getFullYear();
    return fecha=>{const d=new Date(fecha+'T12:00:00');return d.getMonth()+1===ma&&d.getFullYear()===aa;};
  }
  if(S.hRango==='dia') return fecha=>!S.hFecha||fecha===S.hFecha;
  return ()=>true; // 'todo'
}

  const item=S.vCarrito[idx];const prod=S.productos.find(p=>p.id===item.productoId);

function confirVenta(){
  const ct=carritoTotal();const totalC=ct.total,ganC=ct.ganancia;
  // Pago puede ser mayor al total (cliente paga de más / redondeo)
  const pagado=parseFloat(S.vMontoPagado)||0;
  const saldo=Math.max(0,totalC-pagado); // 0 si pagó igual o más
  const excedente=Math.max(0,pagado-totalC); // sobrepago
  // Ganancia = ganancia base del carrito (calculada sobre precios reales cobrados)
  // Si pagó más, el excedente también es ganancia
  const gananciaFinal=ganC+excedente;
  const nombreCl=S.vCliente.trim();
  let cObj=S.clientes.find(c=>c.nombre===nombreCl);
  // Auto-registrar: si el nombre no existe, lo agrega a clientes automáticamente
  if(!cObj && nombreCl){
    cObj={id:Date.now()-1,nombre:nombreCl,telefono:'',notas:'',fechaCreado:hoy()};
    S.clientes=[...S.clientes,cObj];
    toast(`👤 "${nombreCl}" agregado a clientes`);
  }
  const v={
    id:Date.now(),fecha:S.vFecha,cliente:nombreCl,
    clienteId:cObj?cObj.id:null,
    items:S.vCarrito.map(item=>{
      const p=S.productos.find(x=>x.id===item.productoId);
      const precio=item.precioCustom!=null?item.precioCustom:pV(p,item.nivel);
      return{
        productoId:item.productoId,nombre:p.nombre,
        nivel:item.precioCustom!=null?null:item.nivel, // null si precio custom
        cantidad:item.cantidad,precioUnitario:precio,
        esEspecial:item.precioCustom!=null
      };
    }),
    producto:S.vCarrito.map(i=>S.productos.find(x=>x.id===i.productoId)?.nombre||'').join(', '),
    productoId:S.vCarrito[0].productoId,
    nivel:S.vCarrito[0].precioCustom!=null?null:S.vCarrito[0].nivel,
    cantidad:S.vCarrito.reduce((s,i)=>s+i.cantidad,0),
    totalVenta:totalC,
    montoPagado:Math.min(pagado,totalC+excedente), // guarda lo real pagado
    saldo:saldo,
    excedente:excedente>0?excedente:0,
    gananciaReal:gananciaFinal,
  };
  S.vCarrito.forEach(item=>{
    S.productos=S.productos.map(p=>p.id===item.productoId?{...p,stock:p.stock-item.cantidad}:p);
  });
  S.ventas=[...S.ventas,v];saveAll();
  S.vGuardada=v;S.vPaso=3;toast('🎉 ¡Venta registrada!');renderNow();
}

function abrirAbono(id){S.hSheetAb=S.ventas.find(x=>x.id===id);S.hAbono='';renderNow()}
function abonoNumPress(d){
  if(d==='DEL'){S.hAbono=(S.hAbono||'').slice(0,-1);}
  else if(d==='.'){if((S.hAbono||'').includes('.'))S.hAbono+=S.hAbono===''?'0.':'.'}
  else{if(S.hAbono.length<10)S.hAbono+=d;}

  _updateAbonoDisplay();
}
function _updateAbonoDisplay(){
  const v=S.hSheetAb;if(!v)return;

      previewEl.querySelector('#abono-nuevo-saldo').style.color=v.saldo-m<=0?'var(--green)':'var(--amber)';

function confirAbono(){
  const m=parseFloat(S.hAbono);if(!m||m<=0)return;
  const vOrig=S.hSheetAb;
  const totalPagado=vOrig.montoPagado+m;
  const nuevoSaldo=Math.max(0,vOrig.totalVenta-totalPagado);
  const excedente=Math.max(0,totalPagado-vOrig.totalVenta);
  // Si pagó de más, el excedente aumenta la ganancia real
  const nuevaGanancia=(vOrig.gananciaReal||0)+excedente;
  S.ventas=S.ventas.map(v=>v.id===vOrig.id?{
    ...v,
    montoPagado:totalPagado,
    saldo:nuevoSaldo,
    excedente:(v.excedente||0)+excedente,
    gananciaReal:nuevaGanancia
  }:v);
  saveAll();toast(`💵 Abono de ${fmt(m)} registrado`);S.hSheetAb=null;S.hAbono='';renderNow();
}

function _evCant(idx,delta){
  const item=S.hEditV.items[idx];if(!item)return;
  item.cantidad=Math.max(1,item.cantidad+delta);
  renderNow();
}
function _evQuitarItem(idx){
  if(S.hEditV.items.length<=1){toast('⚠️ Debe quedar al menos 1 producto');return;}
  if(!confirm('¿Quitar este producto de la venta?'))return;
  S.hEditV.items.splice(idx,1);
  renderNow();
}

function guardarEditVenta(){
  const e=S.hEditV;
  const v=S.hSheetEditV;
  if(!e.items.length||!e.cliente.trim())return;
  const totalItems=e.items.reduce((s,i)=>s+(i.precioUnitario*i.cantidad),0);
  const mp=parseFloat(e.montoPagado)||0;
  const saldo=Math.max(0,totalItems-mp);
  const excedente=Math.max(0,mp-totalItems);
  const ganItems=e.items.reduce((s,i)=>{
    const p=S.productos.find(x=>x.id===i.productoId);
    const base=p?calcP(p).base:0;
    return s+(i.precioUnitario-base)*i.cantidad;
  },0);
  const ganFinal=ganItems+excedente;

  // Restaurar stock de la venta original
  if(v.items)v.items.forEach(i=>{
    S.productos=S.productos.map(p=>p.id===i.productoId?{...p,stock:p.stock+i.cantidad}:p);
  });
  // Descontar stock de la venta nueva
  e.items.forEach(i=>{
    S.productos=S.productos.map(p=>p.id===i.productoId?{...p,stock:Math.max(0,p.stock-i.cantidad)}:p);
  });

  // Actualizar cliente si cambió nombre
  const nombreNuevo=e.cliente.trim();
  let cObj=S.clientes.find(c=>c.nombre===nombreNuevo);
  if(!cObj&&nombreNuevo){
    cObj={id:Date.now()-1,nombre:nombreNuevo,telefono:'',notas:'',fechaCreado:hoy()};
    S.clientes=[...S.clientes,cObj];
  }

  S.ventas=S.ventas.map(x=>x.id===v.id?{
    ...x,
    cliente:nombreNuevo,
    clienteId:cObj?cObj.id:x.clienteId,
    fecha:e.fecha,
    items:e.items,
    producto:e.items.map(i=>i.nombre).join(', '),
    productoId:e.items[0].productoId,
    cantidad:e.items.reduce((s,i)=>s+i.cantidad,0),
    totalVenta:totalItems,
    montoPagado:mp,
    saldo:saldo,
    excedente:excedente>0?excedente:0,
    gananciaReal:ganFinal,
    nota:e.nota||'',
  }:x);

  S.hSheetEditV=null;
  saveAll();
  toast('✅ Venta actualizada');
  renderNow();
}

function eliminarV(id){
  if(!confirm('¿Eliminar esta venta? El stock será restaurado.'))return;
  const v=S.ventas.find(x=>x.id===id);
  if(v){if(v.items)v.items.forEach(i=>S.productos=S.productos.map(p=>p.id===i.productoId?{...p,stock:p.stock+i.cantidad}:p));
  else S.productos=S.productos.map(p=>p.id===v.productoId?{...p,stock:p.stock+v.cantidad}:p);}
  S.ventas=S.ventas.filter(x=>x.id!==id);saveAll();toast('🗑️ Venta eliminada y stock restaurado');renderNow();
}

const GCATS=[
  {id:'compras',icon:'🛒',label:'Compras Amway'},
  {id:'transporte',icon:'🚗',label:'Transporte'},
  {id:'domicilio',icon:'📦',label:'Domicilio'},

];

function gcatLabel(cat){const c=GCATS.find(x=>x.id===cat||x.label===cat);return c?c.label:(cat||'Otros');}

function rGastos(){
  const fn=_calcRangoFn(S.gRango,S.gFecha,S.gMes,S.gAnio);
  const q=(S.gQ||'').toLowerCase();
  const filPeriodo=S.gastos.filter(g=>fn(g.fecha)&&(!q||g.desc.toLowerCase().includes(q))).sort((a,b)=>b.id-a.id);

  // ── BALANCE GLOBAL (todo el tiempo, independiente del filtro) ──
  const totalCobradoGlobal=sum(S.ventas,'montoPagado');
  const totalGastadoGlobal=S.gastos.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
  const aManoGlobal=totalCobradoGlobal-totalGastadoGlobal;

  // ── Totales del período seleccionado (solo para análisis) ──

function _renderGastosList(){
  const fn=_calcRangoFn(S.gRango,S.gFecha,S.gMes,S.gAnio);
  const q=(S.gQ||'').toLowerCase();
  const fil=S.gastos.filter(g=>fn(g.fecha)&&(!q||g.desc.toLowerCase().includes(q))).sort((a,b)=>b.id-a.id);
  const cnt=document.getElementById('gastos-count');
  const MESES_G=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const labelG=S.gRango==='hoy'?'Hoy':S.gRango==='semana'?'Esta semana':S.gRango==='mes'?'Este mes':S.gRango==='mes-esp'?MESES_G[S.gMes-1]+' '+S.gAnio:S.gRango==='dia'&&S.gFecha?S.gFecha:'Todo el tiempo';

function _gNum(d){
  let m=String(S.gNuevo.monto||'');
  if(d==='DEL'){m=m.slice(0,-1);}
  else if(d==='000'){m=m==='0'?m:(m+'000');}
  else if(d==='0'&&m===''){m='0';}
  else{if(m==='0')m=d;else m+=d;}
  if(parseFloat(m)>9999999)return;
  S.gNuevo.monto=m;
  // Actualizar display sin re-render completo
  const disp=document.querySelector('.sheet .numpad-gasto')?.previousElementSibling?.querySelector('div');
  if(disp){disp.style.fontSize=m?'28px':'18px';disp.style.color=m?'var(--text)':'var(--muted)';disp.textContent=m?('$'+Number(m).toLocaleString('es-CO')):'Ingresa el monto';}
  // Borde del campo
  const campo=document.querySelector('.sheet .numpad-gasto')?.previousElementSibling;
  if(campo)campo.style.borderColor=m?'var(--indigo)':'var(--border2)';
  // Botón
  const btn=document.getElementById('btn-gasto-nuevo');
  if(btn){btn.disabled=!S.gNuevo.desc.trim()||!m;btn.textContent=`💸 Registrar gasto${m?' — $'+Number(m).toLocaleString('es-CO'):''}`;}
}
function _gActBtn(){
  const btn=document.getElementById('btn-gasto-nuevo');
  if(btn)btn.disabled=!S.gNuevo.desc.trim()||!S.gNuevo.monto;
}

function guardarGasto(){
  const n=S.gNuevo;
  if(!n.desc.trim()||!n.monto)return;
  const cat=GCATS.find(c=>c.id===n.cat)||GCATS[0];
  S.gastos=[...S.gastos,{id:Date.now(),desc:n.desc.trim(),monto:parseFloat(n.monto)||0,fecha:n.fecha||hoy(),cat:cat.id}];
  S.gSheetN=false;
  saveAll();
  toast('💸 Gasto registrado');
  renderNow();
}

function sgDiasRestantes(fechaProgr){
  const hoy_=hoy();
  if(fechaProgr===hoy_)return 0;
  const diff=new Date(fechaProgr+'T12:00:00')-new Date(hoy_+'T12:00:00');
  return Math.round(diff/86400000);
}

function sgEstado(r){
  if(r.completado)return{label:'✅ Hecho',color:'var(--green)',bg:'rgba(52,211,153,.12)'};
  const d=sgDiasRestantes(r.fechaProgr);
  if(d<0)return{label:`⏰ Vencido (${Math.abs(d)}d)`,color:'var(--red)',bg:'rgba(248,113,113,.12)'};
  if(d===0)return{label:'⚡ Hoy',color:'var(--amber)',bg:'rgba(251,191,36,.12)'};
  if(d<=3)return{label:`📅 En ${d}d`,color:'var(--amber)',bg:'rgba(251,191,36,.10)'};
  return{label:`📅 En ${d}d`,color:'var(--muted)',bg:'rgba(124,120,168,.10)'};
}

// ── Helpers de fecha seguimiento ──
function _sgSumarDias(n){
  const d=new Date();d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function _sgActBtn(){
  const btn=document.getElementById('btn-sg-nuevo');
  if(btn)btn.disabled=!S.sgNuevo.clienteId||!S.sgNuevo.fechaProgr;
}

// ── Acciones seguimiento ──
function abrirNuevoRecordatorio(){
  S.sgSheetN=true;
  S.sgNuevo={clienteId:'',clienteNombre:'',tipo:'pago',nota:'',fechaProgr:hoy()};
  renderNow();
}

function sgDesdeCliente(clienteId){
  // Abrir nuevo recordatorio pre-seleccionando el cliente
  const c=S.clientes.find(x=>x.id===clienteId);if(!c)return;
  const vs=S.ventas.filter(v=>v.clienteId===clienteId||v.cliente===c.nombre);
  const deuda=vs.reduce((s,v)=>s+(v.saldo||0),0);
  S.sgSheetN=true;
  S.sgNuevo={clienteId:clienteId,clienteNombre:c.nombre,tipo:deuda>0?'pago':'seguim',nota:'',fechaProgr:hoy()};
  S.tab='seguimiento';
  renderNow();
}

function guardarNuevoRecordatorio(){
  const n=S.sgNuevo;
  if(!n.clienteId||!n.fechaProgr)return;
  const cli=S.clientes.find(c=>c.id===parseInt(n.clienteId));
  S.recordatorios=[...S.recordatorios,{
    id:Date.now(),
    clienteId:parseInt(n.clienteId),
    clienteNombre:cli?cli.nombre:n.clienteNombre,
    tipo:n.tipo||'pago',
    nota:(n.nota||'').trim(),
    fechaProgr:n.fechaProgr,
    completado:false,
    fechaComp:null,
    fechaCreado:hoy(),
  }];
  S.sgSheetN=false;
  saveAll();
  toast('🔔 Recordatorio creado');
  renderNow();
}

function completarRecordatorio(id){
  S.recordatorios=S.recordatorios.map(r=>r.id===id?{...r,completado:true,fechaComp:hoy()}:r);
  saveAll();toast('✅ ¡Listo! Marcado como hecho');renderNow();
}

function abrirEditRecordatorio(id){
  const r=S.recordatorios.find(x=>x.id===id);if(!r)return;
  S.sgSheetE=r;
  S.sgEdit={tipo:r.tipo,nota:r.nota||'',fechaProgr:r.fechaProgr};
  renderNow();
}

function guardarEditRecordatorio(){
  const e=S.sgEdit;
  S.recordatorios=S.recordatorios.map(r=>r.id===S.sgSheetE.id?{...r,tipo:e.tipo,nota:e.nota.trim(),fechaProgr:e.fechaProgr}:r);
  S.sgSheetE=null;saveAll();toast('✅ Recordatorio actualizado');renderNow();
}

function eliminarRecordatorio(id,fromSheet=false){
  if(!confirm('¿Eliminar este recordatorio?'))return;
  S.recordatorios=S.recordatorios.filter(r=>r.id!==id);
  if(fromSheet)S.sgSheetE=null;
  saveAll();toast('🗑️ Recordatorio eliminado');renderNow();
}

function llamarCliente(clienteId){
  const c=S.clientes.find(x=>x.id===clienteId);
  if(c&&c.telefono)window.open('tel:'+c.telefono.replace(/\D/g,''));
}

function irAbonoDesdeRecordatorio(clienteId,clienteNombre){
  // Ir a historial y abrir el abono de la primera venta pendiente del cliente
  const v=S.ventas.find(x=>(x.clienteId===clienteId||x.cliente===clienteNombre)&&x.saldo>0);
  if(v){S.tab='historial';S.hRango='todo';renderNow();setTimeout(()=>abrirAbono(v.id),100);}
  else{setTab('historial');}
}

function rRep(){
  const now=new Date(), hs=hoy(), ma=now.getMonth()+1, aa=now.getFullYear();

  // Modo: mes o día específico
  const mododia=!!S.rFecha;
  const vm=mododia
    ? S.ventas.filter(v=>v.fecha===S.rFecha)
    : S.ventas.filter(v=>{const d=new Date(v.fecha+'T12:00:00');return d.getMonth()+1===S.rMes&&d.getFullYear()===S.rAnio;});

  const tV=sum(vm,'totalVenta'), tC=sum(vm,'montoPagado'), tG=sum(vm,'gananciaReal');
  const cartera=tV-tC;
  const pct=tV>0?Math.round(tC/tV*100):0;

  // Gastos del período
  const gperiodo=mododia
    ? S.gastos.filter(g=>g.fecha===S.rFecha)
    : S.gastos.filter(g=>{const d=new Date(g.fecha+'T12:00:00');return d.getMonth()+1===S.rMes&&d.getFullYear()===S.rAnio;});
  const totalGP=gperiodo.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);

  // Balance global a la mano
  const totalCobradoGlobal=sum(S.ventas,'montoPagado');
  const totalGastadoGlobal=S.gastos.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
  const aManoGlobal=totalCobradoGlobal-totalGastadoGlobal;

  // Análisis por producto
  const porP={};
  vm.forEach(v=>{
    (v.items||[{nombre:v.producto,cantidad:v.cantidad,precioUnitario:v.totalVenta/(v.cantidad||1),productoId:v.productoId}]).forEach(i=>{
      if(!porP[i.nombre])porP[i.nombre]={nombre:i.nombre,uds:0,ventas:0,ganancia:0};
      porP[i.nombre].uds+=i.cantidad;
      porP[i.nombre].ventas+=i.precioUnitario*i.cantidad;
      const p=S.productos.find(x=>x.id===i.productoId);
      if(p)porP[i.nombre].ganancia+=(i.precioUnitario-calcP(p).base)*i.cantidad;
    });
  });
  const listaP=Object.values(porP).sort((a,b)=>b.ventas-a.ventas);

  // Label del período
  const periodoLabel=mododia
    ? new Date(S.rFecha+'T12:00:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
    : MESES[S.rMes-1]+' '+S.rAnio;
  const esHoy=S.rFecha===hs;

    <div style="font-size:11px;opacity:.5;margin-top:4px">${vm.length} transacción${vm.length!==1?'es':''}</div>
    <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:rgba(0,0,0,.25);border-radius:12px;overflow:hidden">
      ${[['✅ Cobrado',fmt(tC)],['🏆 Ganancia',fmt(tG)],['⏳ Cartera',fmt(cartera)]].map(([k,v],i)=>'<div style="padding:10px 6px;text-align:center;'+(i>0?'border-left:1px solid rgba(255,255,255,.1)':'')+'"><div style="font-size:9px;opacity:.55;margin-bottom:2px">'+k+'</div><div style="font-weight:800;font-size:14px">'+v+'</div></div>').join('')}
    </div>
  </div>

  <!-- ═══ TARJETAS MÉTRICAS ═══ -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
    <div style="background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px">
      <div style="font-size:9px;color:var(--green);text-transform:uppercase;font-weight:800;margin-bottom:3px">✅ Pagadas</div>
      <div style="font-weight:900;font-size:22px;color:var(--green)">${vm.filter(v=>v.montoPagado>=v.totalVenta).length}</div>
      <div style="font-size:10px;color:var(--muted)">de ${vm.length} ventas</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px">
      <div style="font-size:9px;color:var(--red);text-transform:uppercase;font-weight:800;margin-bottom:3px">⏳ Con saldo</div>
      <div style="font-weight:900;font-size:22px;color:var(--red)">${vm.filter(v=>v.saldo>0).length}</div>
      <div style="font-size:10px;color:var(--muted)">${fmt(cartera)} pendiente</div>
    </div>
  </div>

  <!-- ═══ BARRA COBRO ═══ -->
  ${tV>0?`<div style="background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
      <span style="font-size:12.5px;color:var(--text2);font-weight:700">Tasa de cobro</span>
      <b style="color:${pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--red)'}">
        ${pct}%
      </b>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`:''}

  <!-- ═══ A LA MANO GLOBAL ═══ -->
  <div style="background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(16,185,129,.06));border:1.5px solid rgba(52,211,153,.25);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px">
    <div style="font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.7px;font-weight:800;margin-bottom:4px">💵 Dinero a la mano <span style="font-size:10px;opacity:.6;text-transform:none;font-weight:600">— acumulado total</span></div>
    <div style="font-size:36px;font-weight:900;color:${aManoGlobal>=0?'var(--green)':'var(--red)'};letter-spacing:-1px;line-height:1;margin-bottom:10px">${fmt(aManoGlobal)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:rgba(0,0,0,.12);border-radius:10px;overflow:hidden">
      <div style="padding:8px 6px;text-align:center">
        <div style="font-size:9px;opacity:.7;margin-bottom:2px">✅ Cobrado total</div>
        <div style="font-weight:800;font-size:12px">${fmt(totalCobradoGlobal)}</div>
      </div>
      <div style="padding:8px 6px;text-align:center;border-left:1px solid rgba(255,255,255,.08)">
        <div style="font-size:9px;opacity:.7;margin-bottom:2px">💸 Gastos del período</div>
        <div style="font-weight:800;font-size:12px;color:rgba(248,113,113,.9)">${fmt(totalGP)}</div>
      </div>
      <div style="padding:8px 6px;text-align:center;border-left:1px solid rgba(255,255,255,.08)">
        <div style="font-size:9px;opacity:.7;margin-bottom:2px">💸 Gastos totales</div>
        <div style="font-weight:800;font-size:12px;color:rgba(248,113,113,.9)">${fmt(totalGastadoGlobal)}</div>
      </div>
    </div>
    ${gperiodo.length>0?`<div style="border-top:1px solid rgba(52,211,153,.15);padding-top:8px;margin-top:8px">
      <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px">Gastos del período (${gperiodo.length})</div>
      ${gperiodo.slice(0,5).map(g=>'<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">'+gcatIcon(g.cat)+' '+g.desc+'</span><b style="color:var(--red)">'+fmt(g.monto)+'</b></div>').join('')}
      ${gperiodo.length>5?'<div style="font-size:11px;color:var(--muted);margin-top:5px">+' +(gperiodo.length-5)+ ' más</div>':''}
    </div>`:'<div style="font-size:11px;color:rgba(52,211,153,.5);text-align:center;margin-top:8px">Sin gastos en este período</div>'}
  </div>

  <!-- ═══ TOP PRODUCTOS ═══ -->
  ${listaP.length?`<p class="section-title">📦 Productos — ${periodoLabel}</p>
  ${listaP.map(p=>{const pct2=tV>0?Math.round(p.ventas/tV*100):0;
    return'<div class="card" style="padding:13px 15px;margin-bottom:8px">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px">'
        +'<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+p.nombre+'</div>'
        +'<div style="font-size:11px;color:var(--muted);margin-top:2px">'+p.uds+' unidades</div></div>'
        +'<div style="text-align:right;flex-shrink:0;margin-left:10px">'
          +'<div style="font-weight:900;color:var(--indigo);font-size:17px">'+fmt(p.ventas)+'</div>'
          +'<div style="font-size:12px;color:var(--green);font-weight:700">+'+fmt(p.ganancia)+'</div>'
        +'</div>'
      +'</div>'
      +'<div class="progress-bar"><div class="progress-fill" style="width:'+pct2+'%"></div></div>'
      +'<div style="font-size:11px;color:var(--muted);text-align:right;margin-top:3px">'+pct2+'% del período</div>'
    +'</div>';
  }).join('')}`:`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">Sin ventas — ${periodoLabel}</div></div>`}
  `;
}

// ═══════════════════════════════════════════════
// INICIO — cargar datos antes de renderizar
// ═══════════════════════════════════════════════
renderNow(); // muestra pantalla de carga
loadAll();   // carga IndexedDB, luego renderNow() otra vez con datos
</script>
</body>
</html>
